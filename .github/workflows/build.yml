name: Build Civil AI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore official Autodesk 2026 references
        run: dotnet restore src/CivilAI/CivilAI.csproj --source https://api.nuget.org/v3/index.json
      - name: Build .NET 8 Windows plugin
        run: dotnet build src/CivilAI/CivilAI.csproj --configuration Release --no-restore
      - name: Validate WPF refresh states and bindings
        run: dotnet run --project tests/CivilAI.PanelSmoke/CivilAI.PanelSmoke.csproj --configuration Release
      - name: Verify output contains no dependency DLLs
        shell: pwsh
        run: |
          $output = 'src/CivilAI/bin/Release/net8.0-windows'
          if (!(Test-Path "$output/CivilAI.dll")) { throw 'CivilAI.dll was not produced' }
          $dependencies = @(Get-ChildItem $output -Recurse -Filter *.dll | Where-Object { $_.Name -ne 'CivilAI.dll' })
          if ($dependencies.Count -gt 0) { throw "Unexpected dependency DLLs: $($dependencies.Name -join ', ')" }
      - name: Upload CivilAI.dll only
        uses: actions/upload-artifact@v4
        with:
          name: CivilAI-0.1-${{ github.sha }}
          path: src/CivilAI/bin/Release/net8.0-windows/CivilAI.dll
          if-no-files-found: error
