name: Build Civil AI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore official Autodesk 2026 references
        run: dotnet restore src/CivilAI/CivilAI.csproj --source https://api.nuget.org/v3/index.json
      - name: Build .NET 8 Windows plugin
        run: dotnet build src/CivilAI/CivilAI.csproj --configuration Release --no-restore
      - name: Validate surface statistics
        run: dotnet run --project tests/CivilAI.SurfaceSmoke/CivilAI.SurfaceSmoke.csproj --configuration Release
      - name: Validate reference-property guards and failure isolation
        run: dotnet run --project tests/CivilAI.PropertySmoke/CivilAI.PropertySmoke.csproj --configuration Release
      - name: Validate workspace storage, providers and read-only tool policy
        run: dotnet run --project tests/CivilAI.WorkspaceSmoke/CivilAI.WorkspaceSmoke.csproj --configuration Release
      - name: Validate dark theme contrast and state declarations
        run: dotnet run --project tests/CivilAI.ThemeSmoke/CivilAI.ThemeSmoke.csproj --configuration Release
      - name: Validate WPF workspace, refresh states and bindings
        run: dotnet run --project tests/CivilAI.PanelSmoke/CivilAI.PanelSmoke.csproj --configuration Release
      - name: Verify only plugin and local geometry library are packaged
        shell: pwsh
        run: |
          $output = 'src/CivilAI/bin/Release/net8.0-windows'
          if (!(Test-Path "$output/CivilAI.dll")) { throw 'CivilAI.dll was not produced' }
          $dependencies = @(Get-ChildItem $output -Recurse -Filter *.dll | Where-Object { $_.Name -notin @('CivilAI.dll', 'NetTopologySuite.dll') })
          if ($dependencies.Count -gt 0) { throw "Unexpected dependency DLLs: $($dependencies.Name -join ', ')" }
      - name: Package deployable files together
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item src/CivilAI/bin/Release/net8.0-windows/CivilAI.dll package/
          Copy-Item src/CivilAI/bin/Release/net8.0-windows/NetTopologySuite.dll package/
          Copy-Item third-party/NetTopologySuite-LICENSE.md package/
      - name: Upload plugin and geometry library
        uses: actions/upload-artifact@v4
        with:
          name: CivilAI-0.3-${{ github.sha }}
          path: package/
          if-no-files-found: error





